[package]
name = "chalkdeck"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["FERGOUS Abdelhak"]
license = "MIT"
description = "Classroom-styled slides: a drawn blackboard, notebook or graph-paper backdrop, fully recolourable, with first-class right-to-left support."
repository = "https://github.com/fergousA/chalkdeck"
keywords = ["slides", "presentation", "blackboard", "rtl", "arabic"]
categories = ["presentation"]
compiler = "0.12.0"
exclude = ["gallery/*", "examples/*.pdf"]
